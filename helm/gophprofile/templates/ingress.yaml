apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avatar-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ add (.Values.config.max_file_size | int64) 1048576 | quote }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avatar-service
                port:
                  number: 80
