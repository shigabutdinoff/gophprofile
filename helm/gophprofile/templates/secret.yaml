{{- $pg := required "задайте secrets.postgresPassword" .Values.secrets.postgresPassword }}
{{- $minio := required "задайте secrets.minioPassword" .Values.secrets.minioPassword }}
{{- $rabbit := required "задайте secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword }}
{{- $db := .Values.databaseNamespace }}
apiVersion: v1
kind: Secret
metadata:
  name: avatar-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: "postgres://{{ .Values.postgres.user }}:{{ $pg | urlquery | replace "+" "%20" }}@postgres.{{ $db }}.svc:5432/{{ .Values.postgres.database }}?sslmode=disable"
  s3-access-key: {{ .Values.minio.user | quote }}
  s3-secret-key: {{ $minio | quote }}
  rabbitmq-url: "amqp://{{ .Values.rabbitmq.user }}:{{ $rabbit | urlquery | replace "+" "%20" }}@rabbitmq.{{ $db }}.svc:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: {{ $db }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  minio-user: {{ .Values.minio.user | quote }}
  minio-password: {{ $minio | quote }}
  rabbitmq-user: {{ .Values.rabbitmq.user | quote }}
  rabbitmq-password: {{ $rabbit | quote }}
