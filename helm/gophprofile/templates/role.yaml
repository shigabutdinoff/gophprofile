apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: avatar-config-reader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["avatar-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: avatar-config-reader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: avatar-service
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: avatar-config-reader
  apiGroup: rbac.authorization.k8s.io
