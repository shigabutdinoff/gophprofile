apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-collector
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app: avatar-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avatar-collector
  template:
    metadata:
      labels:
        app: avatar-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-collector.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "gophprofile.podSecurity" 10001 | nindent 8 }}
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            {{- include "gophprofile.containerSecurity" . | nindent 12 }}
          ports:
            - name: otlp
              containerPort: 4318
            - name: metrics
              containerPort: 8889
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: avatar-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: avatar-collector
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app: avatar-collector
spec:
  selector:
    app: avatar-collector
  ports:
    - name: otlp
      port: 4318
    - name: metrics
      port: 8889
