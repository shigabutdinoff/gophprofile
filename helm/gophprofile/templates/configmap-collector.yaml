apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-collector-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: 0.0.0.0:4318}
    processors:
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 30s
    service:
      pipelines:
        metrics: {receivers: [otlp], processors: [batch], exporters: [prometheus]}
