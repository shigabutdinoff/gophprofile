apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.databaseNamespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    name: {{ .Values.databaseNamespace }}
