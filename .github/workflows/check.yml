name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  statictest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: robinraju/release-downloader@v1
        with:
          repository: Yandex-Practicum/go-autotests
          tag: v0.13.8
          fileName: statictest
          out-file-path: .tools
      - run: |
          chmod +x .tools/statictest
          go vet -vettool=.tools/statictest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=cover.out ./...
      - uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml

  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git merge-base "origin/$DEFAULT" HEAD)
          pipx run pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD
