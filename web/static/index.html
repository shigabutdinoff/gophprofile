<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Upload</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Avatar Upload Service</h1>
        <p id="subtitle" class="text-white/80 text-center mt-2">Upload your avatar image</p>
        <nav class="flex justify-center gap-2 mt-4">
          <a href="/web/upload" data-view="upload"
            class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-white/10 hover:bg-white/20 transition-all">Upload</a>
          <a href="/web/gallery/" data-view="gallery"
            class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-white/10 hover:bg-white/20 transition-all">Gallery</a>
        </nav>
      </header>

      <main class="p-6 space-y-6">
        <section id="uploadView" class="space-y-6">
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="userId" class="block text-sm font-medium text-white mb-2">
              User ID <span class="text-red-400">*</span>
            </label>
            <input type="text" id="userId" name="userId" required placeholder="Enter your user ID"
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
          </div>

          <div>
            <label for="image" class="block text-sm font-medium text-white mb-2">
              Choose Image <span class="text-red-400">*</span>
            </label>
            <div class="relative">
              <input type="file" id="image" name="image" accept="image/*" required
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            </div>
            <div id="imagePreview" class="mt-4 hidden">
              <img id="previewImg" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg shadow-lg mx-auto">
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-transparent transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
            <span id="btnText">Upload Avatar</span>
            <span id="btnLoader" class="hidden">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              Uploading...
            </span>
          </button>
        </form>

        <div id="responseContainer" class="hidden">
          <div class="border-t border-white/20 pt-6">
            <h2 class="text-xl font-semibold text-white mb-4">API Response</h2>
            <div id="responseContent" class="space-y-4">
              <div id="responseStatus" class="px-4 py-3 rounded-lg font-mono text-sm"></div>
              <div id="responseBody" class="bg-black/30 rounded-lg p-4 overflow-x-auto">
                <pre id="responseJson" class="text-green-400 text-sm font-mono whitespace-pre-wrap"></pre>
              </div>
            </div>
          </div>
        </div>
        </section>

        <section id="galleryView" class="hidden space-y-6">
          <form id="galleryForm" class="flex gap-2">
            <input type="text" id="galleryUser" required placeholder="Enter user ID"
              class="flex-1 px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            <button type="submit"
              class="bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-200">Show</button>
          </form>
          <p id="galleryEmpty" class="hidden text-white/50 text-center py-8">No avatars yet</p>
          <ul id="galleryList" class="space-y-4"></ul>
        </section>

        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg">
        </div>
      </main>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const responseContainer = document.getElementById('responseContainer');
    const responseStatus = document.getElementById('responseStatus');
    const responseJson = document.getElementById('responseJson');
    const errorMessage = document.getElementById('errorMessage');

    imageInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImg.src = e.target.result;
          imagePreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        imagePreview.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const userId = document.getElementById('userId').value;
      const imageFile = imageInput.files[0];

      if (!userId || !imageFile) {
        showError('Please fill in all required fields');
        return;
      }

      setLoading(true);
      hideError();
      hideResponse();

      const formData = new FormData();
      formData.append('image', imageFile);

      try {
        const response = await fetch('/api/v1/avatars', {
          method: 'POST',
          headers: {
            'X-User-ID': userId
          },
          body: formData
        });

        const responseData = await response.text();
        let parsedData;

        try {
          parsedData = JSON.parse(responseData);
        } catch {
          parsedData = responseData;
        }

        displayResponse(response, parsedData);

      } catch (error) {
        showError(`Network error: ${error.message}`);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled = true;
        btnText.classList.add('hidden');
        btnLoader.classList.remove('hidden');
      } else {
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnLoader.classList.add('hidden');
      }
    }

    function displayResponse(response, data) {
      responseContainer.classList.remove('hidden');

      const statusClass = response.ok
        ? response.status === 201 ? 'bg-green-500/20 border border-green-500/50 text-green-200'
          : 'bg-blue-500/20 border border-blue-500/50 text-blue-200'
        : 'bg-red-500/20 border border-red-500/50 text-red-200';

      responseStatus.className = `px-4 py-3 rounded-lg font-mono text-sm ${statusClass}`;
      responseStatus.textContent = `HTTP ${response.status} ${response.statusText}`;

      if (typeof data === 'object') {
        responseJson.textContent = JSON.stringify(data, null, 2);
      } else {
        responseJson.textContent = data;
      }

      if (!response.ok) {
        showError(`Request failed: ${response.status} ${response.statusText}`);
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }

    function hideResponse() {
      responseContainer.classList.add('hidden');
    }

    const uploadView = document.getElementById('uploadView');
    const galleryView = document.getElementById('galleryView');
    const galleryForm = document.getElementById('galleryForm');
    const galleryUser = document.getElementById('galleryUser');
    const galleryList = document.getElementById('galleryList');
    const galleryEmpty = document.getElementById('galleryEmpty');
    const subtitle = document.getElementById('subtitle');
    const statusClasses = {
      completed: 'bg-green-500/20 border border-green-500/50 text-green-200',
      processing: 'bg-blue-500/20 border border-blue-500/50 text-blue-200',
      failed: 'bg-red-500/20 border border-red-500/50 text-red-200'
    };

    async function failure(response) {
      const status = `HTTP ${response.status} ${response.statusText}`;
      try {
        return `${status}: ${(await response.json()).error}`;
      } catch {
        return status;
      }
    }

    function card(avatar, user) {
      const item = document.createElement('li');
      item.className = 'flex items-center gap-4 px-4 py-3 bg-white/10 border border-white/20 rounded-lg';
      const thumb = avatar.thumbnails.find(t => t.size === '100x100');
      if (thumb) {
        const img = document.createElement('img');
        img.src = thumb.url;
        img.alt = avatar.file_name;
        img.className = 'w-20 h-20 object-cover rounded-lg shadow-lg';
        item.append(img);
      }
      const info = document.createElement('div');
      info.className = 'flex-1 min-w-0 space-y-2';
      const name = document.createElement('p');
      name.className = 'text-white font-medium break-all';
      name.textContent = avatar.file_name;
      const status = document.createElement('span');
      status.className = `inline-block px-2 py-1 rounded-lg font-mono text-xs ${statusClasses[avatar.status] || ''}`;
      status.textContent = avatar.status;
      info.append(name, status);
      const button = document.createElement('button');
      button.textContent = 'Delete';
      button.className = 'bg-red-500/20 border border-red-500/50 text-red-200 font-semibold py-2 px-4 rounded-lg hover:bg-red-500/30 focus:outline-none focus:ring-2 focus:ring-red-500 transition-all duration-200 disabled:opacity-50';
      button.addEventListener('click', async () => {
        hideError();
        button.disabled = true;
        button.textContent = 'Deleting...';
        try {
          const response = await fetch(`/api/v1/avatars/${encodeURIComponent(avatar.id)}`, {
            method: 'DELETE',
            headers: {
              'X-User-ID': user
            }
          });
          if (response.status !== 204) {
            showError(await failure(response));
            return;
          }
          item.remove();
          galleryEmpty.classList.toggle('hidden', galleryList.children.length > 0);
        } catch (error) {
          showError(`Network error: ${error.message}`);
        } finally {
          button.disabled = false;
          button.textContent = 'Delete';
        }
      });
      item.append(info, button);
      return item;
    }

    async function loadGallery(user) {
      galleryList.replaceChildren();
      galleryEmpty.classList.add('hidden');
      if (!user) {
        return;
      }
      try {
        const response = await fetch(`/api/v1/users/${encodeURIComponent(user)}/avatars`);
        if (!response.ok) {
          showError(await failure(response));
          return;
        }
        const avatars = await response.json();
        galleryList.append(...avatars.map(avatar => card(avatar, user)));
        galleryEmpty.classList.toggle('hidden', avatars.length > 0);
      } catch (error) {
        showError(`Network error: ${error.message}`);
      }
    }

    function route() {
      hideError();
      const gallery = location.pathname.startsWith('/web/gallery/');
      uploadView.classList.toggle('hidden', gallery);
      galleryView.classList.toggle('hidden', !gallery);
      subtitle.textContent = gallery ? 'Browse and delete avatars' : 'Upload your avatar image';
      document.querySelectorAll('nav a').forEach(link => {
        link.classList.toggle('bg-white/30', (link.dataset.view === 'gallery') === gallery);
      });
      if (gallery) {
        galleryUser.value = decodeURIComponent(location.pathname.slice('/web/gallery/'.length));
        loadGallery(galleryUser.value);
      }
    }

    function go(path) {
      history.pushState(null, '', path);
      route();
    }

    document.querySelectorAll('nav a').forEach(link => link.addEventListener('click', e => {
      e.preventDefault();
      const user = galleryUser.value || document.getElementById('userId').value;
      go(link.dataset.view === 'gallery' ? `/web/gallery/${encodeURIComponent(user)}` : '/web/upload');
    }));

    galleryForm.addEventListener('submit', e => {
      e.preventDefault();
      go(`/web/gallery/${encodeURIComponent(galleryUser.value)}`);
    });

    window.addEventListener('popstate', route);
    route();
  </script>
</body>

</html>
